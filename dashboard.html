<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الدكتور | عيادة الحياة البيطرية</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3F5A3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/booking.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="dashboard">

<header id="site-header"></header>

<main>
  <!-- Login gate -->
  <section class="gate" id="gate">
    <div class="container d-flex justify-content-center">
      <form class="gate-card" id="gateForm">
        <h2>دخول لوحة التحكم</h2>
        <p>الصفحة دي خاصة بالدكتور فقط.</p>
        <div id="gateEmailRow"><input type="email" id="gateEmail" placeholder="الإيميل" autocomplete="username" dir="ltr"></div>
        <input type="password" id="gatePassword" placeholder="كلمة المرور" autocomplete="current-password" required>
        <button type="submit" class="vbtn vbtn-primary vbtn-lg vbtn-block mt-2">دخول</button>
        <p id="gateError" class="gate-error mt-2 mb-0" hidden>بيانات الدخول غلط، حاول تاني.</p>
        <p id="gateHint" class="gate-hint"></p>
        <button type="button" id="forgotBtn" class="btn btn-link p-0 small" hidden>نسيت كلمة المرور؟</button>
        <p id="forgotMsg" class="small mt-2 mb-0" hidden></p>
      </form>
    </div>
  </section>

  <!-- Dashboard -->
  <section class="dash" id="dashboard" hidden>
    <div class="container">
      <div class="dash-top">
        <div>
          <span class="eyebrow">الحجوزات</span>
          <h2 class="mb-0">مواعيد اليوم وكل الحجوزات</h2>
        </div>
        <div class="d-flex gap-2">
          <button class="vbtn vbtn-outline vbtn-sm" id="pwBtn">تغيير كلمة المرور</button>
          <button class="vbtn vbtn-outline vbtn-sm" id="logoutBtn">تسجيل خروج</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><strong id="stToday">0</strong><span>حجوزات النهارده</span></div>
        <div class="stat"><strong id="stNew">0</strong><span>جديدة (محتاجة تأكيد)</span></div>
        <div class="stat"><strong id="stUpcoming">0</strong><span>قادمة</span></div>
        <div class="stat"><strong id="stTotal">0</strong><span>الإجمالي</span></div>
      </div>

      <div class="filters">
        <input type="search" id="fSearch" placeholder="ابحث بالاسم أو الموبايل..." aria-label="بحث">
        <select id="fStatus" aria-label="الحالة">
          <option value="">كل الحالات</option>
          <option value="new">جديد</option>
          <option value="confirmed">مؤكد</option>
          <option value="done">تم الكشف</option>
          <option value="cancelled">ملغي</option>
        </select>
        <input type="date" id="fDate" aria-label="التاريخ">
        <div class="d-flex gap-2">
          <button class="vbtn vbtn-accent vbtn-sm" id="fToday">النهارده</button>
          <button class="vbtn vbtn-outline vbtn-sm" id="fReset">مسح</button>
        </div>
      </div>

      <table class="bookings-table">
        <thead>
          <tr><th>التاريخ</th><th>الوقت</th><th>صاحب الحيوان</th><th>الحيوان</th><th>المشكلة</th><th>الحالة</th><th></th></tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
      <p id="noBookings" class="no-bookings" hidden>لا يوجد حجوزات لسه.</p>
    </div>
  </section>

  <!-- Change password modal -->
  <div class="modal fade" id="pwModal" tabindex="-1" aria-label="تغيير كلمة المرور" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="pwForm">
        <div class="modal-header border-0 pb-0"><h2 class="mb-0 fs-4">تغيير كلمة المرور</h2><button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="إغلاق"></button></div>
        <div class="modal-body">
          <div class="form-row"><label for="pwOld">كلمة المرور الحالية</label><input type="password" id="pwOld" autocomplete="current-password" required></div>
          <div class="form-row"><label for="pwNew">كلمة المرور الجديدة (6 حروف على الأقل)</label><input type="password" id="pwNew" autocomplete="new-password" minlength="6" required></div>
          <div class="form-row"><label for="pwNew2">تأكيد كلمة المرور الجديدة</label><input type="password" id="pwNew2" autocomplete="new-password" minlength="6" required></div>
          <p id="pwMsg" class="fw-bold mb-3" hidden></p>
          <button type="submit" class="vbtn vbtn-primary vbtn-block">حفظ كلمة المرور</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Pet file modal -->
  <div class="modal fade" id="petModal" tabindex="-1" aria-label="ملف الحيوان" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0"><button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="إغلاق"></button></div>
        <div class="modal-body" id="petModalContent"></div>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
